
name: FBSPL PR Security Checks

on:
  push:
    branches: [DevOps]
  pull_request:
    branches: [DevOps]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 0. Detect the project stacks and package manager
  detect-stack:
    name: Detect Project Stack
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.detect.outputs.node }}
      python: ${{ steps.detect.outputs.python }}
      docker: ${{ steps.detect.outputs.docker }}
      node_manager: ${{ steps.detect.outputs.node_manager }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect project files
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f Dockerfile ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f pnpm-lock.yaml ] && [ -f package-lock.json ]; then
            echo "node_manager=conflict" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            echo "node_manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "node_manager=npm" >> "$GITHUB_OUTPUT"
          else
            echo "node_manager=none" >> "$GITHUB_OUTPUT"
          fi

  # 1. Secret scanning
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Static application security testing
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ vars.CODEQL_LANGUAGES || 'javascript-typescript' }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze code
        uses: github/codeql-action/analyze@v3

  # 3. Review dependency changes in pull requests
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # 4. Node.js dependency, lint, test and build checks
  node-security:
    name: Node.js Security and Quality
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.node == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package manager
        shell: bash
        env:
          NODE_MANAGER: ${{ needs.detect-stack.outputs.node_manager }}
        run: |
          set -euo pipefail
          if [ "$NODE_MANAGER" = "conflict" ]; then
            echo "Both pnpm-lock.yaml and package-lock.json exist."
            echo "Keep only the intended package manager lockfile."
            exit 1
          fi

          if [ "$NODE_MANAGER" = "none" ]; then
            echo "No supported lockfile found."
            echo "Commit pnpm-lock.yaml or package-lock.json."
            exit 1
          fi

      - name: Setup pnpm
        if: needs.detect-stack.outputs.node_manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: '10.32.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ needs.detect-stack.outputs.node_manager == 'pnpm' && 'pnpm' || 'npm' }}

      - name: Install and audit pnpm dependencies
        if: needs.detect-stack.outputs.node_manager == 'pnpm'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high

      - name: Install and audit npm dependencies
        if: needs.detect-stack.outputs.node_manager == 'npm'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high

      - name: Run lint
        shell: bash
        env:
          NODE_MANAGER: ${{ needs.detect-stack.outputs.node_manager }}
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            if [ "$NODE_MANAGER" = "pnpm" ]; then
              pnpm lint
            else
              npm run lint
            fi
          else
            echo "No lint script configured; skipping."
          fi

      - name: Run tests
        shell: bash
        env:
          NODE_MANAGER: ${{ needs.detect-stack.outputs.node_manager }}
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            if [ "$NODE_MANAGER" = "pnpm" ]; then
              pnpm test
            else
              npm test
            fi
          else
            echo "No test script configured; skipping."
          fi

      - name: Build application
        shell: bash
        env:
          NODE_MANAGER: ${{ needs.detect-stack.outputs.node_manager }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          set -euo pipefail
          if ! node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            echo "No build script found."
            exit 1
          fi

          if [ "$NODE_MANAGER" = "pnpm" ]; then
            pnpm build
          else
            npm run build
          fi

  # 5. Python dependency security and tests
  python-security:
    name: Python Security and Quality
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.python == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

          if [ -f pyproject.toml ]; then
            python -m pip install .
          fi

      - name: Audit Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pip-audit

          if [ -f requirements.txt ]; then
            python -m pip_audit -r requirements.txt
          else
            python -m pip_audit
          fi

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run pytest when tests exist
        shell: bash
        run: |
          set -euo pipefail
          if [ -d tests ]; then
            python -m pip install pytest
            python -m pytest
          else
            echo "No tests directory found; skipping."
          fi

  # 6. Filesystem, secrets, dependency and IaC scanning
  trivy-filesystem:
    name: Trivy Filesystem and IaC
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # 7. Build and scan a Docker image if a root Dockerfile exists
  container-security:
    name: Container Image Security
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.docker == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: fbspl-security-scan:${{ github.sha }}
          load: true
          push: false

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: fbspl-security-scan:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
